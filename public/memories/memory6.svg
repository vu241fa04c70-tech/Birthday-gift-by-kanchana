<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg6)" />
  <circle cx="400" cy="240" r="190" fill="url(#sunburst)" />
  
  <!-- Trophy / Medal Icon -->
  <g transform="translate(340, 160) scale(1.2)">
    <path d="M 20 20 L 80 20 L 70 70 Q 50 90 30 70 Z" fill="#facc15" stroke="#eab308" stroke-width="4" />
    <path d="M 20 28 Q 0 28 0 45 Q 0 60 22 62" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round" />
    <path d="M 80 28 Q 100 28 100 45 Q 100 60 78 62" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round" />
    <rect x="42" y="78" width="16" height="25" fill="#ca8a04" />
    <polygon points="25,115 75,115 70,103 30,103" fill="#a16207" />
    <text x="50" y="55" font-size="24" text-anchor="middle">⭐</text>
  </g>
  
  <!-- Confetti bits -->
  <circle cx="220" cy="180" r="8" fill="#f43f5e" />
  <rect x="540" y="160" width="12" height="12" fill="#38bdf8" transform="rotate(30 540 160)" />
  <circle cx="580" cy="260" r="7" fill="#a855f7" />
  <rect x="250" y="270" width="14" height="8" fill="#10b981" transform="rotate(-25 250 270)" />
  <circle cx="390" cy="100" r="6" fill="#fbbf24" />
  
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1">CELEBRATING YOUR BIG WIN</text>
  <text x="400" y="510" font-family="system-ui, sans-serif" font-size="16" fill="#c7d2fe" text-anchor="middle">"Nobody worked harder, and nobody deserved it more. So proud of you!"</text>
</svg>
