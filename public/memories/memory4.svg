<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" />
      <stop offset="30%" stop-color="#9d174d" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sunsetBg)" />
  <!-- Big Golden Sun -->
  <circle cx="400" cy="380" r="110" fill="#fef08a" opacity="0.9" />
  <!-- Ocean waves -->
  <path d="M 0 430 Q 200 410 400 430 T 800 430 L 800 600 L 0 600 Z" fill="#0f172a" />
  <path d="M 0 460 Q 200 445 400 460 T 800 460 L 800 600 L 0 600 Z" fill="#1e1b4b" opacity="0.7" />
  <!-- Sun reflection on water -->
  <ellipse cx="400" cy="480" rx="120" ry="15" fill="#fef08a" opacity="0.5" />
  <ellipse cx="400" cy="510" rx="90" ry="10" fill="#fde047" opacity="0.4" />
  <ellipse cx="400" cy="535" rx="60" ry="6" fill="#fde047" opacity="0.3" />
  
  <!-- Flying birds -->
  <path d="M 220 220 Q 230 205 240 220 Q 250 205 260 220" fill="none" stroke="#fef08a" stroke-width="2.5" />
  <path d="M 280 200 Q 288 188 296 200 Q 304 188 312 200" fill="none" stroke="#fef08a" stroke-width="2" />
  
  <text x="400" y="575" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fef3c7" text-anchor="middle" letter-spacing="1">GOLDEN HOUR BEACH TALKS</text>
</svg>
