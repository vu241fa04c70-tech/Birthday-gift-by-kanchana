<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg5)" />
  <!-- Table surface -->
  <ellipse cx="400" cy="420" rx="350" ry="140" fill="#78350f" opacity="0.6" />
  
  <!-- Pizza Slice -->
  <g transform="translate(340, 220) scale(1.3)">
    <polygon points="50,10 0,110 100,110" fill="#f59e0b" />
    <!-- Crust -->
    <path d="M -5 110 Q 50 125 105 110" fill="none" stroke="#d97706" stroke-width="14" stroke-linecap="round" />
    <!-- Pepperonis -->
    <circle cx="50" cy="50" r="10" fill="#dc2626" />
    <circle cx="35" cy="80" r="10" fill="#dc2626" />
    <circle cx="65" cy="85" r="10" fill="#dc2626" />
    <!-- Cheese strands -->
    <path d="M 45 35 Q 50 45 45 55" fill="none" stroke="#fef08a" stroke-width="3" />
  </g>
  <!-- Notebook and glasses -->
  <rect x="180" y="340" width="100" height="70" rx="5" fill="#f8fafc" />
  <line x1="195" y1="355" x2="265" y2="355" stroke="#94a3b8" stroke-width="2" />
  <line x1="195" y1="370" x2="265" y2="370" stroke="#94a3b8" stroke-width="2" />
  <line x1="195" y1="385" x2="245" y2="385" stroke="#94a3b8" stroke-width="2" />
  
  <text x="400" y="490" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fef3c7" text-anchor="middle" letter-spacing="1">STUDY NIGHT TURNED PIZZA PARTY</text>
  <text x="400" y="530" font-family="system-ui, sans-serif" font-size="16" fill="#a7f3d0" text-anchor="middle">"We studied for 10 minutes and spent 4 hours talking and laughing"</text>
</svg>
