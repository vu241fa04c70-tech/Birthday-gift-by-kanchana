<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)" />
  <!-- Moon -->
  <circle cx="620" cy="140" r="60" fill="url(#moon)" />
  <!-- Mountains silhouette -->
  <path d="M 0 450 L 150 320 L 320 420 L 500 290 L 680 430 L 800 360 L 800 600 L 0 600 Z" fill="#0f172a" />
  <path d="M 0 490 L 180 390 L 350 480 L 580 380 L 800 470 L 800 600 L 0 600 Z" fill="#090d16" />
  
  <!-- Car with headlights -->
  <g transform="translate(360, 470)">
    <rect x="0" y="20" width="100" height="35" rx="10" fill="#38bdf8" />
    <path d="M 20 20 L 35 0 L 75 0 L 85 20 Z" fill="#0284c7" />
    <circle cx="25" cy="55" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="4" />
    <circle cx="75" cy="55" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="4" />
    <!-- Light beam -->
    <polygon points="100,28 280,10 280,60 100,42" fill="#fef08a" opacity="0.3" />
  </g>
  <!-- Stars -->
  <circle cx="120" cy="100" r="2" fill="#fff" />
  <circle cx="280" cy="80" r="2.5" fill="#fff" />
  <circle cx="450" cy="130" r="1.5" fill="#fff" />
  <circle cx="200" cy="190" r="2" fill="#fff" />
  <circle cx="360" cy="220" r="2.5" fill="#fde047" />
  
  <text x="400" y="555" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">MIDNIGHT ROAD TRIP ADVENTURE</text>
</svg>
